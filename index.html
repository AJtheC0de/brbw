<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bewerbungs-Tracker</title>
  <meta name="theme-color" content="#f6f7fb">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%236366f1'/><path d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <div>
          <h1>Bewerbungen</h1>
          <p class="subtitle" id="subtitle">Dein Überblick</p>
        </div>
      </div>
      <div class="top-actions">
        <div class="menu-wrap">
          <button class="icon-btn" id="menuBtn" aria-label="Mehr" aria-haspopup="true">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
          <div class="menu" id="menu" role="menu">
            <button role="menuitem" data-action="export-csv">CSV exportieren</button>
            <button role="menuitem" data-action="export-json">Backup speichern (JSON)</button>
            <button role="menuitem" data-action="import">Importieren (CSV / JSON)</button>
            <hr>
            <button role="menuitem" data-action="reset" class="danger">Alle Daten löschen</button>
          </div>
        </div>
        <button class="btn primary" id="addBtn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Neue Bewerbung</span>
        </button>
      </div>
    </header>

    <section class="stats" id="stats" aria-label="Statistik"></section>

    <section class="distribution" aria-label="Verteilung">
      <div class="dist-bar" id="distBar"></div>
    </section>

    <section class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Firma, Stelle oder Notiz suchen…" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="filters" id="filters" role="tablist"></div>
      <select id="sort" class="select" aria-label="Sortierung">
        <option value="date-desc">Neueste zuerst</option>
        <option value="date-asc">Älteste zuerst</option>
        <option value="company">Firma A–Z</option>
        <option value="updated">Zuletzt bearbeitet</option>
      </select>
    </section>

    <main class="list" id="list" aria-live="polite"></main>
  </div>

  <!-- Drawer -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <form id="form" autocomplete="off">
      <div class="drawer-head">
        <div class="drawer-title">
          <div class="avatar lg" id="drawerAvatar">?</div>
          <div>
            <h2 id="drawerTitle">Neue Bewerbung</h2>
            <p class="muted" id="drawerMeta"></p>
          </div>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Schliessen">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="drawer-body">
        <div class="field-grid">
          <label class="field">
            <span>Firma</span>
            <input name="firma" required placeholder="z.B. Swisscom">
          </label>
          <label class="field">
            <span>Stelle</span>
            <input name="stelle" placeholder="z.B. Customer Success Manager">
          </label>
          <label class="field">
            <span>Beworben am</span>
            <input name="datum" type="date">
          </label>
          <label class="field">
            <span>Entscheid am</span>
            <input name="absageAm" type="date">
          </label>
        </div>

        <div class="block">
          <div class="block-head">
            <h3>Verlauf</h3>
            <span class="muted small">Wie weit bist du gekommen?</span>
          </div>
          <div class="stepper" id="phaseStepper"></div>
          <label class="inline-date" id="phaseDateWrap" hidden>
            <span id="phaseDateLabel">Datum</span>
            <input type="date" id="phaseDate">
          </label>
        </div>

        <div class="block">
          <div class="block-head">
            <h3>Ergebnis</h3>
            <span class="muted small">Wie ist es ausgegangen?</span>
          </div>
          <div class="status-picker" id="statusPicker"></div>
        </div>

        <div class="block">
          <div class="block-head">
            <h3>Links</h3>
            <span class="muted small">Bestätigungen, Einladungen, Absagen</span>
          </div>
          <div class="links" id="linksList"></div>
          <div class="add-row">
            <select id="linkType" class="select sm"></select>
            <input id="linkUrl" type="url" placeholder="https://mail.google.com/…">
            <button type="button" class="btn ghost sm" id="addLinkBtn">Hinzufügen</button>
          </div>
        </div>

        <div class="block">
          <div class="block-head"><h3>Notizen</h3></div>
          <div class="add-note">
            <textarea id="noteText" rows="2" placeholder="Notiz schreiben… (⌘/Ctrl + Enter)"></textarea>
            <button type="button" class="btn ghost sm" id="addNoteBtn">Notiz hinzufügen</button>
          </div>
          <ol class="notes" id="notesList"></ol>
        </div>
      </div>

      <div class="drawer-foot">
        <button type="button" class="btn danger-ghost" id="deleteBtn">Löschen</button>
        <div class="spacer"></div>
        <button type="button" class="btn ghost" data-close>Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".csv,.json,text/csv,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
